buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://api.modrinth.com/maven' }
    }
    dependencies {
        classpath 'net.fabricmc:intermediary:1.20.1:v2'
        classpath 'maven.modrinth:fabric-api:0.92.2+1.20.1'
        classpath 'maven.modrinth:yacl:dvS5DjUA'
    }
}

plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

group = 'mcaxolotl.spatialguiextras'
version = '1.0.0'
base { archivesName = 'spatial-gui-extras' }

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

apply from: 'gradle/minecraft.gradle'

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings intermediaryMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'maven.modrinth:fabric-api:0.92.2+1.20.1'
    modImplementation 'maven.modrinth:spatial-gui:meaWd4hB'
    modImplementation 'maven.modrinth:yacl:dvS5DjUA'
    modCompileOnly 'maven.modrinth:modmenu:7.2.2'
    modRuntimeOnly 'maven.modrinth:modmenu:7.2.2'
    implementation 'io.github.llamalad7:mixinextras-fabric:0.5.0'
    include 'io.github.llamalad7:mixinextras-fabric:0.5.0'
    modImplementation modrinthModules('fabric-api-0.92.2+1.20.1.jar')
    modRuntimeOnly modrinthModules('yacl-dvS5DjUA.jar')
}

loom {
    mixin { useLegacyMixinAp = false }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs += ['-proc:none']
}

processResources {
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('sourcesJar') { from('LICENSE') }
jar {
    from('LICENSE')
    manifest.attributes('Implementation-Vendor': 'McAxolotl', 'License': 'MIT')
}

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}
